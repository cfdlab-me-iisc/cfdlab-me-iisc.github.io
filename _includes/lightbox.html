<dialog class="viewer" data-viewer-dialog aria-label="Media viewer">
  <div class="viewer__frame">
    <button type="button" class="viewer__close" data-viewer-close aria-label="Close viewer">{% include icon.html name="close" %}</button>
    <div class="viewer__media" data-viewer-media></div>
    <p class="viewer__caption" data-viewer-caption></p>
  </div>
</dialog>
